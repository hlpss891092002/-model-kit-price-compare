version: "3.8"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: price-comparison-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/pricedb
    depends_on:
      - db
    volumes:
      - ../backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  server:
    build:
      context: ../server/nuxt-app
      dockerfile: Dockerfile
    container_name: price-comparison-server
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:8000
      - PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ../server/nuxt-app:/app

  frontend:
    build:
      context: ../frontend/react-app
      dockerfile: Dockerfile
    container_name: price-comparison-frontend
    ports:
      - "5173:5173"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ../frontend/react-app:/app
    stdin_open: true

  db:
    image: postgres:15-alpine
    container_name: price-comparison-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=pricedb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: