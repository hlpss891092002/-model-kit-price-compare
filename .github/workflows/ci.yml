name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          cd backend
          source venv/bin/activate
          python -m pytest tests/ || echo "Tests not configured yet"

      - name: Lint Python Code
        run: |
          cd backend
          source venv/bin/activate
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install and Build React App
        run: |
          cd frontend/react-app
          npm ci
          npm run build

      - name: Run React Tests
        run: |
          cd frontend/react-app
          npm test -- --passWithNoTests

  nuxt-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install and Build Nuxt Server
        run: |
          cd server/nuxt-app
          npm ci
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, nuxt-build]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Docker Image
        run: |
          cd backend
          docker build -t price-comparison-backend:test .

      - name: Build Frontend Docker Image
        run: |
          cd frontend/react-app
          docker build -t price-comparison-frontend:test .

      - name: Build Server Docker Image
        run: |
          cd server/nuxt-app
          docker build -t price-comparison-server:test .

  go-load-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build Load Test
        run: |
          cd load-test
          go mod download
          go build hey_test.go